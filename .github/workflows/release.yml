name: Release Browser Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      - name: Validate built extension manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          const expectedTag = `v${manifest.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match manifest ${manifest.version}; expected ${expectedTag}`);
          }
          console.log(`built manifest valid: ${manifest.version}`);
          NODE

      - name: Package extension
        run: |
          cp README.md dist/README.md
          cd dist
          zip -r "../notebooklm-transcript-${{ github.ref_name }}.zip" .
          cd ..
          test "$(unzip -Z1 "notebooklm-transcript-${{ github.ref_name }}.zip" | grep -c '^manifest.json$')" -eq 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "notebooklm-transcript-*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "notebooklm-transcript-*.zip"
          generate_release_notes: true
